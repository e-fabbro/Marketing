# Configuração da Agência REVERA. Fonte lida por scripts/ e pelo DUDS.
# Campos TODO: perguntar ao Fabbro; nunca preencher por suposição.

marca:
  instituto: "Instituto REVERA de Psiquiatria Intervencionista e Saúde Mental da Mulher"
  nome_curto: "REVERA"            # sem acento
  medica: "Dra. Jessica Jacomelli"      # fonte: SOUL.md do DUDS e cron do DUDS; confirmar grafia do CRM
  crm: "27043"
  crm_uf: "DF"                    # fonte: cron do DUDS ("CRM-DF 27043"); confirmar
  rqe: "22349"
  marca_principal: "pessoal"      # fonte: SOUL.md do DUDS ("marca pessoal"); P2: confirmar se o REVERA entra como 2ª conta
  cidade: "Brasília"              # fonte: SOUL.md do DUDS (presencial e telemedicina)

aprovadores:                      # únicos IDs de Telegram cuja decisão vale como APROVADO/AJUSTAR/DESCARTAR
  - nome: "Fabbro (Eduardo)"
    telegram_id: 5326591280       # fonte: config do DUDS (home_channel "Eduardo"); confirmar
  - nome: "Dra. Jessica"
    telegram_id: 2085222248       # P1 confirmado pelo Fabbro em 26/09

telegram:
  grupo_marketing_chat_id: -5238127555   # fonte: cron do DUDS, chat "Marketing - Duds"; candidato a canal de aprovação (P1)

fuso: "America/Sao_Paulo"         # o cron do Hermes grava em UTC; converter ao agendar

horarios:                         # horário local (fuso acima)
  coleta_metricas: "07:00"
  anomalias_ads: "09:00"
  pauta_semanal: "Mon 08:00"      # colide com job existente do DUDS às 08:00 — resolver na Fase 6
  relatorio_semanal: "Fri 18:00"
  relatorio_mensal: "1 09:00"
  resumo_gutcha: "19:45"
  backup_db: "03:00"

llm:
  # Decisão D1(b): mesma credencial OAuth ChatGPT do DUDS, via hermes proxy (validar na Fase 2).
  provedor: "hermes-proxy"
  base_url_env: "AGENCIA_LLM_BASE_URL"
  api_key_env: "AGENCIA_LLM_API_KEY"

especialistas:
  # Modelos = os que o DUDS já usa (config.yaml: default gpt-5.6-terra; delegation gpt-6-astra).
  # Segue a regra da skill existente modelo-criativos-astra: Terra para texto, Astra só para visual.
  # Validar nomes no hermes proxy na Fase 2.
  estrategista: {modelo: "gpt-5.6-terra", temperatura: 0.7, max_tokens: 4000, prioridade: "alta"}
  redator:      {modelo: "gpt-5.6-terra", temperatura: 0.8, max_tokens: 3000, prioridade: "media"}
  designer:     {modelo: "gpt-6-astra",   temperatura: 0.5, max_tokens: 2000, prioridade: "media"}
  compliance:   {modelo: "gpt-5.6-terra", temperatura: 0.0, max_tokens: 2500, prioridade: "alta"}
  trafego:      {modelo: "gpt-5.6-terra", temperatura: 0.3, max_tokens: 3000, prioridade: "media"}
  analista:     {modelo: "gpt-5.6-terra", temperatura: 0.2, max_tokens: 3000, prioridade: "baixa"}

google_ads:
  contas:                         # P4 (Fabbro, 26/09)
    - {customer_id: "384-507-8701", nome: "Dra. Jessica Jacomelli (a confirmar pelo `contas`)"}
  mcc_login_customer_id: "674-415-5743"   # conta administradora (MCC) informada em 26/09; vai em DUDS_GOOGLE_ADS_LOGIN_CUSTOMER_ID (secrets/env.sh)
  verba_mensal: 1000              # P4: R$ 1.000/mês (Fabbro, 26/09); ritmo diário de referência = verba/30
  anomalias: {janela_dias: 28, sigmas: 2.0, ritmo_max: 1.5}

instagram:
  conta: "TODO"                   # P3: @ da conta Instagram Profissional (o ID vai no .env)
  pagina_facebook: "TODO"         # P3: nome da Página vinculada
  permissoes_app: ["instagram_basic", "instagram_content_publish", "instagram_manage_insights", "pages_read_engagement"]  # P3: conferir no app Meta
  horario_padrao: "18:30"         # usado quando a pauta não traz horário
  medir_apos_horas: 20

compliance:
  max_voltas: 2                   # 3ª reprovação → ESCALAR ao humano
  cvv: "188"

custo:
  # Assinatura ChatGPT não fatura por token: o teto é em tokens/mês por especialista e no total.
  teto_tokens_mes_total: 0        # P6 (Fabbro, 26/09): sem limite por enquanto; 0 = sem teto
  teto_tokens_mes_por_especialista: 0   # idem

caminhos:
  raiz: "/root/.hermes/profiles/duds/agencia-revera"
  db: "dados/agencia.db"
  conteudo: "conteudo"
  relatorios: "relatorios"
  logs: "logs"
