# Instalar (root, só com autorização do Fabbro). Serve as PNGs para a API do Instagram (que exige URL pública).
# 1) mkdir -p /var/www/agencia-midia && chown root:www-data /var/www/agencia-midia && chmod 750 /var/www/agencia-midia
# 2) cp deploy/nginx-agencia-midia.conf /etc/nginx/snippets/agencia-midia.conf
# 3) no server {} de hermes.caixadeprioridades.com.br (443): include snippets/agencia-midia.conf;
# 4) nginx -t && systemctl reload nginx
# Nomes de arquivo são aleatórios (18 bytes) e não há listagem; ainda assim, apagar arquivos antigos (Fase 6).
location /agencia-midia/ {
    alias /var/www/agencia-midia/;
    autoindex off;
    add_header Cache-Control "public, max-age=86400";
    types { image/png png; image/jpeg jpg; }
    default_type application/octet-stream;
}
