# Paleta oficial — extraída dos SVGs do kit (Drive "Identidade Visual", Cacau Arte Criativa, 2023):
#   "Paleta de Cores cópia 2.svg": #E5DFDC, #9A8A85, #C6BCB9   |   "Logotipo Horizontal 1.svg": fundo #E7DEDB, símbolo #9A8A85, texto #7F7D6B
fundo: "#E5DFDC"        # bege claro da paleta (o logotipo usa #E7DEDB, equivalente)
fundo_alt: "#C6BCB9"    # tom médio da paleta
texto: "#7F7D6B"        # cinza-oliva do texto do logotipo (títulos)
texto_corpo: "#4F4E42"  # DERIVADO: escurecimento do texto oficial para legibilidade de corpo (contraste ≥ 4.5:1 sobre o fundo)
destaque: "#9A8A85"     # cor principal da marca (símbolo)
apoio: "#9A8A85"
fontes:                 # P5 (Fabbro, 26/09): Playfair (regular/bold) para títulos; Poppins (regular/italic/bold) para o resto.
  titulo: "'Playfair Display', Georgia, serif"      # assumido Playfair Display (Google Fonts, OFL); arquivos em fontes/
  corpo: "'Poppins', 'Helvetica Neue', Arial, sans-serif"
  arquivos:             # carregados por @font-face nos templates (caminho relativo à raiz do projeto)
    - {familia: "Playfair Display", arquivo: "brand/identidade-visual/fontes/PlayfairDisplay-Variable.ttf", peso: "400 900", estilo: normal}
    - {familia: "Playfair Display", arquivo: "brand/identidade-visual/fontes/PlayfairDisplay-Italic-Variable.ttf", peso: "400 900", estilo: italic}
    - {familia: "Poppins", arquivo: "brand/identidade-visual/fontes/Poppins-Regular.ttf", peso: "400", estilo: normal}
    - {familia: "Poppins", arquivo: "brand/identidade-visual/fontes/Poppins-Italic.ttf", peso: "400", estilo: italic}
    - {familia: "Poppins", arquivo: "brand/identidade-visual/fontes/Poppins-SemiBold.ttf", peso: "600", estilo: normal}
    - {familia: "Poppins", arquivo: "brand/identidade-visual/fontes/Poppins-Bold.ttf", peso: "700", estilo: normal}
logo: "brand/identidade-visual/logo.svg"   # Logotipo Horizontal 1 (SVG do Drive), sem o fundo e recortado ao conteúdo
logo_claro: "brand/identidade-visual/logo_claro.svg"   # DERIVADO: mesmo logotipo em cor de fundo, para capas escuras
nome_marca: "Dra. Jessica Jacomelli"
